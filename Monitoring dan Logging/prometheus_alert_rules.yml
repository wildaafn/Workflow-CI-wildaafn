groups:
- name: model_alerts
  rules:
  - alert: HighRequestRate
    expr: rate(request_count_total[1m]) > 10
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High request rate detected"
      description: "Request rate is above 10 req/s for the last 1 minute."
  - alert: HighErrorRate
    expr: rate(error_count_total[1m]) > 1
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"
      description: "Model serving is returning errors."
