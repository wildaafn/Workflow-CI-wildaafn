name: ML Workflow CI
on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
  workflow_dispatch:

jobs:
  run-mlproject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 virtualenv scikit-learn pandas

      - name: Run MLProject
        run: |
          cd MLProject
          python -m mlflow run . --env-manager=local

      - name: Save Artifacts
        run: |
          cd MLProject
          # Simpan artifact mlflow
          tar -cvf ../mlruns.tar mlruns
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-artifact
          path: mlruns.tar

      - name: Build and Push Docker Image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          cd MLProject
          # Cek apakah secrets sudah diatur
          if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "=========================================================================="
            echo "🚨 ERROR: DOCKER_USERNAME atau DOCKER_PASSWORD belum diatur di GitHub Secrets!"
            echo "Silakan ikuti langkah berikut untuk memperbaikinya:"
            echo "1. Buka repositori Anda di GitHub."
            echo "2. Masuk ke tab 'Settings' -> 'Secrets and variables' -> 'Actions'."
            echo "3. Klik 'New repository secret'."
            echo "4. Tambahkan secret berikut:"
            echo "   - Nama: DOCKER_USERNAME  (isi dengan username Docker Hub Anda)"
            echo "   - Nama: DOCKER_PASSWORD  (isi dengan password/token Docker Hub Anda)"
            echo "5. Setelah ditambahkan, jalankan ulang workflow ini."
            echo "=========================================================================="
            exit 1
          fi
          # Dapatkan RUN_ID dari mlruns
          RUN_ID=$(ls mlruns/0 | grep -v meta.yaml | grep -v datasets | head -n 1)
          echo "RUN_ID: $RUN_ID"
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
          # Build docker using mlflow
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n "$DOCKER_USER/ml-model:latest" --env-manager=local
          docker push "$DOCKER_USER/ml-model:latest"
